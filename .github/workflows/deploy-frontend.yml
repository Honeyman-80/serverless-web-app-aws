name: Deploy frontend to S3

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::654375431894:role/DeployFrontendToServerlessWebAppBucket
          aws-region: us-east-1

      - name: Deploy frontend to S3
        run: aws s3 sync frontend/ s3://serverless-web-app-dave-2026 --delete
              
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id EU5T7HYKOJV6P --paths "/*"
